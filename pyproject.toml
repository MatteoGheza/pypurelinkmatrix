[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypurelinkmatrix"
version = "0.1.2"
description = "Python library for connecting and managing PureLink matrix devices"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
authors = [
    {name = "Matteo Gheza", email = "me@matteogheza.it"}
]
keywords = [
    "purelink",
    "matrix",
    "device",
    "connection",
    "video-matrix",
    "av-over-ip",
    "pro-av",
    "audiovisual",
    "broadcast"
]
classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Other Audience",

    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Software Development :: Libraries :: Python Modules",

    "Natural Language :: English",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
simulator = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "rich>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.0.280",
    "mypy>=1.4.1",
    "pre-commit>=3.3.3",
    "types-requests>=2.32.4.20250913",
    "aiohttp>=3.9.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
simulator = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/matteogheza/pypurelinkmatrix"
Documentation = "https://github.com/matteogheza/pypurelinkmatrix?tab=readme-ov-file#usage"
Repository = "https://github.com/matteogheza/pypurelinkmatrix.git"
Issues = "https://github.com/matteogheza/pypurelinkmatrix/issues"

[project.scripts]
purelink-sim = "pypurelinkmatrix.simulator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pypurelinkmatrix"]

[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
lint.select = ["E", "F", "W", "I", "N", "UP", "B", "A"]
lint.ignore = []
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--cov=src/pypurelinkmatrix --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
omit = ["src/pypurelinkmatrix/simulator/*"]
